services:
  auth:
    build:
      context: ../api
      dockerfile: Dockerfile
    image: reconmail-service:latest
    command: ["com.reconmail.api.AuthServiceMain"]
    environment:
      PORT: "8081"
      DB_DIR: "/data"
    volumes:
      - auth-data:/data
    expose:
      - "8081"

  keys:
    image: reconmail-service:latest
    command: ["com.reconmail.api.KeyServiceMain"]
    environment:
      PORT: "8082"
      DB_DIR: "/data"
    volumes:
      - keys-data:/data
    depends_on:
      - auth
    expose:
      - "8082"

  mail:
    image: reconmail-service:latest
    command: ["com.reconmail.api.MailServiceMain"]
    environment:
      PORT: "8083"
      DB_DIR: "/data"
      KEY_SERVICE_URL: "http://keys:8082"
    volumes:
      - mail-data:/data
    depends_on:
      - keys
    expose:
      - "8083"

  gateway:
    image: reconmail-service:latest
    command: ["com.reconmail.api.GatewayMain"]
    environment:
      PORT: "8080"
      AUTH_URL: "http://auth:8081"
      KEY_URL: "http://keys:8082"
      MAIL_URL: "http://mail:8083"
    depends_on:
      - auth
      - keys
      - mail
    expose:
      - "8080"

  caddy:
    image: caddy:2
    depends_on:
      - gateway
    ports:
      - "8080:8080"   # swap to 443:443 + a domain in the Caddyfile for real TLS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile

volumes:
  auth-data: {}
  keys-data: {}
  mail-data: {}
